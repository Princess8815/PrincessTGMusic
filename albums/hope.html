e a flame\nAnd no matter what they call us\nWe still know our names\n\nThis is our pride\nStanding in the light\nAfter every battle\nAfter every fight\n\nWe were never broken\nWe were born to shine\nThis is our moment\nThis is our pride\n\nTo every trans girl dreaming\nTo every trans boy too\nTo every soul still searching\nFor a way to make it through\n\nTo every gay and lesbian\nTo every bi heart strong\nYou deserve a future\nYou deserve to belong\n\nThis is our pride\nRising with the dawn\nEven when the cold winds\nTell us to move on\n\nWe are still standing\nStill reaching for the sky\nWith love beside us\nThis is our pride\n\nWhen the world feels heavy\nAnd hope is hard to find\nTake my hand beside you\nLeave the fear behind\n\nYou are not a burden\nYou are not alone\nThere's a place that's waiting\nA place to call your home\n\nThis is our pride\nLouder than before\nEvery heart united\nOpening the door\n\nTrans and gay and lesbian\nBi and so much more\nWe will keep on rising\nLike waves against the shore\n\nNo matter who you are\nNo matter where you hide\nYou deserve your future\nYou deserve your pride\n\nThis is our pride\nAnd we'll carry it\nThrough the night\nUntil the morning light\n"},{"title":"Back In Time","src":"../audioPlayer/audio/Back%20In%20Time.mp3","description":"A song about reflecting on the past and wishing to go back in time to change things. It explores themes of regret, nostalgia, and the desire for a second chance.","lyrics":"If I saw her before she knew\nThe girl inside would soon be true\n\nI walk a mile every day\nWondering why it is this way\nEvery thought returns to you\nThe girl I never let shine through\n\nId go back to make it right \nTo help her win her inner fight\n\nI see her standing in the light\nThe life I hid just out of sight\nEvery step I took away\nLeft the truth I couldn't say\n\nIF I COULD TAKE ME BACK IN TIME\nID BE THE GIRL THAT WAS INSIDE\nBODY MIND AND SOUL ALINE \nID HAVE BEEN THE GIRL ALL THIS TIME\n\nBut time moves nger burns in flame\nShe stands where once her silence bled\nAlive, reborn, no longer dead"}]}</script>

(() => {
  "use strict";
  const { tracks } = JSON.parse(document.getElementById("album-data").textContent);
  const get = (id) => document.getElementById(id);
  const audio = get("audio");
  const play = get("play");
  const seek = get("seek");
  const volume = get("volume");
  const rows = Array.from(get("track-list").children);
  let current = 0;
  let playRequest = 0;
  let stopped = false;

  const status = (message) => { get("status").textContent = message; };
  function time(seconds) {
    if (!Number.isFinite(seconds)) return "--:--";
    seconds = Math.max(0, Math.floor(seconds));
    return Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
  }
  function updateProgress() {
    const ready = Number.isFinite(audio.duration) && audio.duration > 0;
    seek.disabled = !ready;
    seek.max = ready ? audio.duration : 1;
    seek.value = ready ? audio.currentTime : 0;
    get("elapsed").textContent = time(audio.currentTime);
    get("duration").textContent = time(audio.duration);
    seek.setAttribute("aria-valuetext", time(audio.currentTime) + " of " + time(audio.duration));
  }
  function updateButtons() {
    const playing = !audio.paused && !audio.ended;
    play.textContent = playing ? "Pause" : "Play";
    play.setAttribute("aria-pressed", String(playing));
    rows.forEach((row, index) => {
      const selected = index === current;
      row.classList.toggle("active", selected);
      const button = row.querySelector("button");
      if (selected) button.setAttribute("aria-current", "true");
      else button.removeAttribute("aria-current");
      row.querySelector(".track-state").textContent = selected ? (playing ? "Playing" : "Selected") : "Play";
    });
  }
  function updateVolume() {
    volume.value = audio.volume;
    const muted = audio.muted || audio.volume === 0;
    get("mute").textContent = muted ? "Unmute" : "Mute";
    get("mute").setAttribute("aria-pressed", String(muted));
    get("volume-value").textContent = Math.round((muted ? 0 : audio.volume) * 100) + "%";
  }
  async function startPlayback() {
    const request = ++playRequest;
    try { await audio.play(); }
    catch (error) {
      if (request !== playRequest || error.name === "AbortError") return;
      status(error.name === "NotAllowedError"
        ? "Press Play to start the music."
        : "Unable to play this track. Try another track or reload the page.");
      updateButtons();
    }
  }
  function selectTrack(index, autoplay) {
    ++playRequest;
    audio.pause();
    current = index;
    stopped = false;
    const track = tracks[current];
    audio.src = track.src;
    audio.load();
    get("now-title").textContent = track.title;
    get("track-position").textContent = "Track " + (current + 1) + " of " + tracks.length;
    get("song-description").textContent = track.description;
    get("song-description").hidden = !track.description;
    get("lyrics").textContent = track.lyrics;
    get("lyrics-panel").hidden = !track.lyrics;
    get("song-info").hidden = !track.description && !track.lyrics;
    status("Ready to play " + track.title + ".");
    updateProgress();
    updateButtons();
    if (autoplay) void startPlayback();
  }
  function skip(direction) {
    const wasPlaying = !audio.paused && !audio.ended;
    if (direction < 0 && audio.currentTime > 3) {
      audio.currentTime = 0;
      updateProgress();
      return;
    }
    selectTrack((current + direction + tracks.length) % tracks.length, wasPlaying);
  }

  play.addEventListener("click", () => {
    if (audio.paused) {
      stopped = false;
      if (audio.ended) audio.currentTime = 0;
      void startPlayback();
    } else { ++playRequest; audio.pause(); }
  });
  get("stop").addEventListener("click", () => {
    ++playRequest;
    stopped = true;
    audio.pause();
    audio.currentTime = 0;
    updateProgress();
    updateButtons();
    status("Stopped. Press Play to restart " + tracks[current].title + ".");
  });
  get("previous").addEventListener("click", () => skip(-1));
  get("next").addEventListener("click", () => skip(1));
  rows.forEach((row, index) => row.querySelector("button").addEventListener("click", () => selectTrack(index, true)));
  seek.addEventListener("input", () => {
    if (!seek.disabled) audio.currentTime = Number(seek.value);
    updateProgress();
  });
  volume.addEventListener("input", () => {
    audio.volume = Number(volume.value);
    if (audio.volume > 0) audio.muted = false;
  });
  get("mute").addEventListener("click", () => {
    if (audio.muted || audio.volume === 0) { audio.muted = false; if (audio.volume === 0) audio.volume = 1; }
    else audio.muted = true;
  });
  audio.addEventListener("volumechange", updateVolume);
  ["loadedmetadata", "durationchange", "timeupdate", "emptied"].forEach((event) => audio.addEventListener(event, updateProgress));
  audio.addEventListener("play", () => { updateButtons(); status("Playing " + tracks[current].title + "."); });
  audio.addEventListener("pause", () => {
    updateButtons();
    if (!audio.ended && !stopped) status("Paused: " + tracks[current].title + ".");
  });
  audio.addEventListener("ended", () => {
    if (current + 1 < tracks.length) selectTrack(current + 1, true);
    else if (get("repeat").checked) selectTrack(0, true);
    else { updateButtons(); status("Album finished. Choose a track to listen again."); }
  });
  audio.addEventListener("error", () => {
    updateButtons();
    status("Could not load " + tracks[current].title + ". Try another track.");
  });

  // Keep native controls as a fallback if JavaScript is disabled.
  audio.controls = false;
  get("custom-controls").hidden = false;
  get("previous").disabled = tracks.length < 2;
  get("next").disabled = tracks.length < 2;
  selectTrack(0, false);
  updateVolume();
})();
</script>
</body>
</html>
