<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settings | PrincessTG Creations</title>
  <link rel="icon" href="../images/logo avatar.png">
  <link rel="stylesheet" href="../styles/auth.css">
  <script type="module" src="../script/auth.js"></script>
  <script type="module" src="../script/site-settings.js"></script>
  <style>
    body{margin:0;background:linear-gradient(140deg,#0d101c,#1b1530);color:#f6f3ff;font-family:system-ui,-apple-system,Arial,sans-serif;line-height:1.65}
    .ptg-settings-page{width:min(780px,94%);margin:34px auto;padding:0 0 40px}
    .ptg-settings-page h1{font-size:clamp(2rem,4vw,2.9rem);margin:5px 0 7px}
    .ptg-settings-page p{color:#c6badb}
    .settings-card{border:1px solid #58436f;border-radius:18px;background:#1a1b2d;padding:clamp(18px,4vw,30px);box-shadow:0 18px 36px #0004}
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .settings-field{display:grid;gap:8px;margin-bottom:10px}
    .settings-field label{font-weight:750;color:#eee1ff}
    .settings-field select{width:100%;min-height:47px;border:1px solid #75628d;border-radius:9px;background:#101522;color:#fff;padding:10px;font:inherit}
    .settings-check{display:flex;gap:12px;align-items:center;margin:12px 0;font-weight:650}
    .settings-check input{width:20px;height:20px;accent-color:#b28cff}
    .settings-actions{display:flex;gap:13px;flex-wrap:wrap;margin-top:15px}
    .settings-actions button{background:#8252c5;color:#fff;border:1px solid #b991f4;padding:11px 19px;border-radius:9px;font-weight:750;cursor:pointer}
    .settings-actions button.secondary{background:#28243b}
    .settings-preview{border:1px solid #605474;border-radius:12px;padding:15px;margin-top:22px;background:#252239}
    .settings-preview strong{color:var(--ptg-shell-accent,#b48cff)}
    #settings-status{min-height:24px}
    @media(max-width:550px){.settings-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="auth-container"></div>
  <main class="ptg-settings-page">
    <p style="color:#c2a2f4;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem">Personalize your experience</p>
    <h1>Settings</h1>
    <p>Change how PrincessTG Creations looks and feels on this browser. These preferences don't change your account or your music.</p>
    <form id="site-settings-form" class="settings-card">
      <div class="settings-grid">
        <div class="settings-field">
          <label for="settings-accent">Accent color</label>
          <select id="settings-accent">
            <option value="violet">Violet (default)</option>
            <option value="rose">Rose</option>
            <option value="teal">Teal</option>
          </select>
        </div>
        <div class="settings-field">
          <label for="settings-text">Text size</label>
          <select id="settings-text">
            <option value="normal">Normal</option>
            <option value="large">Larger text</option>
          </select>
        </div>
      </div>
      <label class="settings-check" for="settings-contrast">
        <input id="settings-contrast" type="checkbox">
        Higher contrast navigation and footer
      </label>
      <label class="settings-check" for="settings-motion">
        <input id="settings-motion" type="checkbox">
        Reduce animations and transitions
      </label>
      <div class="settings-actions">
        <button type="submit">Save preferences</button>
        <button type="button" id="settings-reset" class="secondary">Reset to defaults</button>
      </div>
      <p id="settings-status" role="status" aria-live="polite"></p>
      <div class="settings-preview">
        <strong>Live preview</strong>
        <p>Your sidebar, footer, and accent colors update as you save. Changes persist on this browser.</p>
      </div>
    </form>
  </main>
</body>
</html>
