<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101d32">
  <title>404 | You swam too deep! | PrincessTG Creations</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    *{box-sizing:border-box}
    html{min-height:100%}
    body{
      min-height:100vh;margin:0;padding:clamp(20px,4vw,55px) 18px;
      color:#ecfdff;
      background:
        radial-gradient(ellipse 35% 30% at 17% 18%,#214d65 0%,transparent 100%),
        radial-gradient(ellipse 30% 30% at 88% 84%,#20385e 0%,transparent 100%),
        linear-gradient(160deg,#0d2039,#131a37 65%,#1e1940);
      display:grid;place-items:center;overflow-x:hidden;
    }
    .reef{width:min(680px,100%);text-align:center;position:relative;isolation:isolate}
    .glow{position:absolute;inset:2% 4% auto;height:65%;z-index:-1;
      border-radius:50%;background:#46bec01c;filter:blur(50px)}
    .eyebrow{color:#a7edec;text-transform:uppercase;font-size:.85rem;
      font-weight:850;letter-spacing:.18em;margin:0}
    h1{font-size:clamp(2.4rem,7.2vw,4.75rem);line-height:1.07;
      letter-spacing:-.05em;margin:10px auto 16px;text-wrap:balance}
    h1 span{color:#99f6e4}
    .lead{font-size:clamp(1rem,2.7vw,1.23rem);line-height:1.65;
      color:#d4e7f6;margin:0 auto;max-width:540px}
    .sea-portrait{position:relative;max-width:550px;margin:10px auto -4px}
    .axolotl{display:block;width:100%;height:auto;overflow:visible;
      filter:drop-shadow(0 21px 25px #050a2066);
      animation:float 4s ease-in-out infinite;
      --body:#ffadc5;--belly:#ffe8f1;--gill:#fa719b;--fin:#f887af;--spark:#ffedf4;
    }
    .axolotl .body{fill:var(--body)}
    .axolotl .belly{fill:var(--belly)}
    .axolotl .gill{fill:var(--gill)}
    .axolotl .fin{fill:var(--fin)}
    .axolotl .shine{fill:var(--spark)}
    .axolotl .outline{stroke:#3a506d;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
    .axolotl .freckle{fill:#d47494;opacity:.75}
    .axolotl .face{fill:#273247}
    .axolotl .smile{fill:none;stroke:#744c73;stroke-width:4;stroke-linecap:round}
    .axolotl .bubble{fill:none;stroke:#82dced;stroke-width:4;opacity:.65}
    .axolotl [data-decor]{display:none}
    .axolotl [data-decor="bow"]{display:block}
    .caption{margin:-7px 0 25px;color:#a9dfe9;font-size:.91rem}
    .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .actions a{min-height:50px;display:inline-flex;align-items:center;justify-content:center;
      border-radius:13px;padding:12px 24px;font-size:1rem;font-weight:850;
      text-decoration:none;transition:transform .15s,background .15s}
    .actions a:hover{transform:translateY(-2px)}
    .actions a:focus-visible{outline:3px solid #80f6ee;outline-offset:4px}
    .primary{background:#94f5d9;color:#10253c;box-shadow:0 7px 20px #57eac43b}
    .primary:hover{background:#c1fff0}
    .secondary{background:#24334d;border:1px solid #648ba2;color:#e9fdff}
    .secondary:hover{background:#334661}
    footer{margin-top:27px;font-size:.82rem;color:#9ab3c9}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}
      50%{transform:translateY(-8px) rotate(1deg)}}
    @media(prefers-reduced-motion:reduce){.axolotl{animation:none}.actions a{transition:none}}
    @media(max-width:440px){.actions a{width:100%}}
  </style>
</head>
<body>
  <main class="reef">
    <div class="glow" aria-hidden="true"></div>
    <p class="eyebrow">404 · Lost in the reef</p>
    <h1>You swam <span>too deep!</span></h1>
    <p class="lead">This page slipped beyond the coral reef. Our little axolotl
      can guide you back to PrincessTG Creations.</p>

    <div class="sea-portrait">
      <!-- One axolotl illustration, with a randomly selected color and accessory. -->
      <svg class="axolotl" id="axolotl" xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 550 360" role="img" aria-labelledby="axolotl-title axolotl-description">
        <title id="axolotl-title">A cheerful pink axolotl</title>
        <desc id="axolotl-description">A single cute axolotl floating in an underwater scene.</desc>
        <ellipse cx="275" cy="331" rx="163" ry="15" fill="#061a2b" opacity=".18"/>
        <g aria-hidden="true">
          <circle class="bubble" cx="77" cy="96" r="16"/><circle class="bubble" cx="468" cy="69" r="11"/>
          <circle class="bubble" cx="444" cy="179" r="21"/><circle class="bubble" cx="94" cy="245" r="8"/>
          <path d="M91 63l7-13 7 13-7 13zM452 248l6-12 6 12-6 12z" fill="#aaf4e8" opacity=".55"/>
          <path d="M143 272l6-10 6 10-6 10zM396 105l5-9 5 9-5 9z" fill="#aaf4e8" opacity=".5"/>
        </g>

        <!-- Tail and little swimming feet. -->
        <path class="fin outline" d="M336 239c68-8 109 14 120 61-22-3-39-12-54-25-5 35-28 52-62 54 18-29 15-58-4-90z"/>
        <path class="body outline" d="M210 191c-12 29-22 51-22 81 3 43 33 62 85 62 61 0 99-30 99-69 0-35-18-61-34-87z"/>
        <ellipse class="belly" cx="276" cy="263" rx="62" ry="55" opacity=".88"/>
        <path class="body outline" d="M200 260c-39-10-50 2-47 20 4 12 20 16 39 11l21-13z"/>
        <path class="body outline" d="M354 262c38-6 52 4 45 22-6 13-22 15-43 7l-16-16z"/>
        <path class="body outline" d="M224 318c-7 19-26 26-41 20-8-9-3-20 9-26z"/>
        <path class="body outline" d="M331 314c10 22 27 27 41 19 7-10 1-21-9-26z"/>

        <!-- Feathery external gills, six fans behind one smiling head. -->
        <g class="gill outline">
          <path d="M173 166c-46-20-77-47-77-82-28 23-13 55 24 84-46-4-73 6-78 32 29 25 71 22 123 8z"/>
          <path d="M189 124c-29-46-32-77-13-99 24 17 33 46 30 88z"/>
          <path d="M375 166c46-20 77-47 77-82 28 23 13 55-24 84 46-4 73 6 78 32-29 25-71 22-123 8z"/>
          <path d="M359 124c29-46 32-77 13-99-24 17-33 46-30 88z"/>
        </g>
        <path class="body outline" d="M181 108c19-25 57-37 95-37 66 0 120 33 120 95
          0 60-45 98-121 98-75 0-122-38-122-98 0-25 9-44 28-58z"/>
        <ellipse class="shine" cx="247" cy="116" rx="66" ry="17" opacity=".34" transform="rotate(-8 247 116)"/>

        <!-- Face -->
        <ellipse class="face" cx="218" cy="173" rx="8" ry="11"/>
        <ellipse class="face" cx="335" cy="173" rx="8" ry="11"/>
        <circle fill="#fff" cx="215" cy="169" r="3"/>
        <circle fill="#fff" cx="332" cy="169" r="3"/>
        <ellipse class="freckle" cx="189" cy="192" rx="21" ry="12"/>
        <ellipse class="freckle" cx="364" cy="192" rx="21" ry="12"/>
        <path class="smile" d="M258 192q17 19 35 0"/>
        <circle class="shine" cx="233" cy="203" r="3"/>
        <circle class="shine" cx="314" cy="203" r="3"/>

        <!-- Exactly one matching accessory is shown on each page visit. -->
        <g data-decor="bow" transform="translate(320 92)">
          <path d="M0 0Q-37-29-45-3Q-33 19 0 6Q34 19 45-3Q35-29 0 0z" fill="#9c54ae" stroke="#4e3a68" stroke-width="4"/>
          <circle cx="0" cy="3" r="9" fill="#f7d2ff" stroke="#4e3a68" stroke-width="3"/>
        </g>
        <g data-decor="star" transform="translate(320 81)">
          <path d="M0-29L8-9 30-9 12 5 19 28 0 15-19 28-12 5-30-9-8-9z"
            fill="#ffdf77" stroke="#6c5080" stroke-width="4" stroke-linejoin="round"/>
        </g>
        <g data-decor="leaf" transform="translate(309 73)">
          <path d="M0 24C-12-24 8-44 48-38C42 2 28 18 0 24Z" fill="#79dd8c" stroke="#3c7964" stroke-width="4"/>
          <path d="M1 21Q22-10 43-34" fill="none" stroke="#3c7964" stroke-width="3"/>
        </g>
        <g data-decor="crown" transform="translate(275 83)">
          <path d="M-41 0L-46-35-20-15 0-43 21-15 46-35 41 0Z"
            fill="#ffe18b" stroke="#82634c" stroke-width="4" stroke-linejoin="round"/>
          <rect x="-43" y="-2" width="86" height="11" rx="5" fill="#f5b55e" stroke="#82634c" stroke-width="3"/>
          <circle cx="0" cy="-10" r="6" fill="#91e8e4"/>
        </g>
        <g data-decor="shell" transform="translate(323 87)">
          <path d="M-35 13C-38-20-22-37 0-38C24-38 39-19 35 13Z"
            fill="#f3dfff" stroke="#7d7bb2" stroke-width="4"/>
          <path d="M0-35v46M-16-31l9 43M17-31L8 12" fill="none" stroke="#b1a9df" stroke-width="3"/>
          <ellipse cx="0" cy="13" rx="36" ry="8" fill="#c9a6df" stroke="#7d7bb2" stroke-width="3"/>
        </g>
      </svg>
    </div>
    <p id="axolotl-caption" class="caption" aria-live="polite">A little friend will guide you home.</p>
    <nav class="actions" aria-label="Return to the website">
      <a class="primary" id="redirect-now" href="/PrincessTGMusic/">Redirect now</a>
      <a class="secondary" id="browse-songs" href="/PrincessTGMusic/audioPlayer/index.html">Browse songs</a>
    </nav>
    <footer>PrincessTG Creations · Even the best swimmers take a wrong turn.</footer>
  </main>
  <script>
    (function(){
      // One randomized axolotl design per page load. No external images or
      // network calls, so the 404 also works when broken asset URLs are involved.
      const friends=[
        {name:"Marina",description:"pink with a bow",
          body:"#ffa9c3",belly:"#ffe7ef",gill:"#fa76a2",fin:"#ef94b7",spark:"#fff6fa",
          freckle:"#e47c9d",decor:"bow"},
        {name:"Luna",description:"lavender with a star",
          body:"#c3b0ff",belly:"#f3eaff",gill:"#9879e8",fin:"#aa9cf0",spark:"#faf3ff",
          freckle:"#9a81cd",decor:"star"},
        {name:"Sprout",description:"mint green with a leaf",
          body:"#89dfb7",belly:"#e2fff0",gill:"#55bb9b",fin:"#79d0bf",spark:"#f2fff7",
          freckle:"#60b898",decor:"leaf"},
        {name:"Sunny",description:"golden with a tiny crown",
          body:"#ffc77c",belly:"#fff0cf",gill:"#f39583",fin:"#f6af67",spark:"#fff9e6",
          freckle:"#e99a78",decor:"crown"},
        {name:"Pearl",description:"sky blue with a seashell",
          body:"#93cfff",belly:"#e8f6ff",gill:"#74a7e7",fin:"#7cbae9",spark:"#f4fbff",
          freckle:"#86a1d5",decor:"shell"}
      ];
      const picked=friends[Math.floor(Math.random()*friends.length)];
      const art=document.getElementById("axolotl");
      for(const property of ["body","belly","gill","fin","spark"])
        art.style.setProperty("--"+property,picked[property]);
      art.querySelectorAll(".freckle").forEach(node=>node.style.fill=picked.freckle);
      art.querySelectorAll("[data-decor]").forEach(node=>{
        node.style.display=node.dataset.decor===picked.decor?"block":"none";
      });
      document.getElementById("axolotl-title").textContent=
        "A cute "+picked.description+" axolotl";
      document.getElementById("axolotl-caption").textContent=
        picked.name+" the axolotl is here to guide you back.";
      // GitHub Pages project sites are hosted under the repository path;
      // Live Server and future custom domains normally use their own root.
      const base=location.hostname.endsWith(".github.io")
        ?"/PrincessTGMusic/":"/";
      document.getElementById("redirect-now").href=base;
      document.getElementById("browse-songs").href=base+"audioPlayer/index.html";
    })();
  </script>
</body>
</html>
