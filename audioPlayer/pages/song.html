
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Song Details | PrincessTG Music</title>

  <meta
    name="description"
    content="Song information, lyrics, and music by PrincessTG."
  >

  <link
    rel="icon"
    href="../../images/logo avatar.png"
  >

  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../../styles/auth.css">

  <script
    type="module"
    src="../../script/auth.js"
  ></script>

  <script
    type="module"
    src="../script/song-pages.js"
  ></script>

  <style>
    [hidden] {
      display: none !important;
    }

    #songLyrics {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .translation-toggle-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 15px 0;
    }

    .translation-toggle-container input {
      width: 18px;
      height: 18px;
    }

    .song-navigation {
      margin-bottom: 20px;
    }

    .song-navigation a {
      color: #b893ff;
    }

    #songPlayer {
      width: 100%;
      margin: 10px 0;
    }

    .song-error {
      color: #ff9e9e;
    }
  </style>
</head>

<body>

  <div id="auth-container"></div>

  <main class="app">

    <nav class="song-navigation">
      <a href="../index.html">
        Back to Song List
      </a>
    </nav>

    <header class="app__header">
      <h1 id="songTitle">Loading song...</h1>
      <p id="songStatus" class="status">
        Reading song information...
      </p>
    </header>

    <section
      id="audioSection"
      class="now-playing"
      hidden
    >
      <h2>Listen</h2>

      <audio
        id="songPlayer"
        controls
        preload="metadata"
      ></audio>

      <button id="playSong" type="button">
        Play
      </button>

      <button id="stopSong" type="button">
        Stop
      </button>
    </section>

<section id="audioNoticeSection" class="now-playing" hidden>
  <p id="audioNotice" class="status"></p>
</section>

    <section class="now-playing">
      <h2>Description</h2>
      <p id="songDescription"></p>
    </section>

    <section class="now-playing">
      <h2>Album</h2>
      <p id="songAlbum"></p>
    </section>

    <section class="now-playing">
      <h2>Genre</h2>
      <p id="songGenre"></p>
    </section>

    <section class="now-playing">
      <h2>Release Date</h2>
      <p id="songDate"></p>
    </section>

    <section class="now-playing">
      <h2>Submitted By</h2>
      <p id="songBy"></p>
    </section>

    <section class="now-playing">

      <details class="lyrics-dropdown">
        <summary>Lyrics</summary>

        <div
          id="translationToggleContainer"
          class="translation-toggle-container"
          hidden
        >
          <input
            type="checkbox"
            id="translationToggle"
          >

          <label for="translationToggle">
            Show English Translation
          </label>
        </div>

        <pre id="songLyrics">Loading lyrics...</pre>

      </details>

    </section>

  </main>
</body>
</html>
