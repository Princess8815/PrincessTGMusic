
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}" />
  <meta property="og:title" content="{{PAGE_TITLE}}" />
  <meta property="og:description" content="{{META_DESCRIPTION}}" />
  <meta property="og:image" content="{{LOGO_URL}}" />
  <meta property="og:url" content="{{PAGE_URL}}" />
  <meta property="og:type" content="music.song" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{PAGE_TITLE}}" />
  <meta name="twitter:description" content="{{META_DESCRIPTION}}" />
  <meta name="twitter:image" content="{{LOGO_URL}}" />

  <link rel="icon" type="image/png" href="../../images/logo avatar.png" />
  <link rel="stylesheet" href="../styles/main.css" />
  <link rel="stylesheet" href="../../styles/auth.css">
  <link rel="stylesheet" href="../../styles/site-shell.css" data-ptg-shell-style="1">
  <script type="module" src="../../script/site-shell.js"></script>

  <script type="module" src="../../script/auth.js" defer></script>

  <style>
    .translation-toggle-container {
      display: none;
      align-items: center;
      gap: 10px;
      margin: 15px 0;
    }

    .translation-toggle-container.visible {
      display: flex;
    }

    .translation-toggle-container label {
      cursor: pointer;
    }

    .translation-toggle-container input {
      cursor: pointer;
      width: 18px;
      height: 18px;
      accent-color: #b85cff;
    }

    #songLyrics {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body data-song-id="{{PAGE_ID}}" data-song-title="{{SONG_TITLE}}">
  <div id="auth-container"></div>

  <main class="app">

    <button id="back" type="button">
      <a href="../index.html">Back to Song List</a>
    </button>

    <header class="app__header">
      <h1 id="songTitle">{{SONG_TITLE}}</h1>
      <p class="status">Song details page</p>
    </header>

    <section class="now-playing">
      <audio
        id="songPlayer"
        controls
        style="width:100%; margin-top:10px;"
      ></audio>

      <button id="playSong" type="button">Play</button>
      <button id="stopSong" type="button">Stop</button>
    </section>

    <section class="now-playing">
      <h2>Description</h2>
      <p id="songDescription">{{SONG_DESCRIPTION}}</p>
    </section>

    <section class="now-playing">
      <h2>Album</h2>
      <p id="songAlbum">{{SONG_ALBUM}}</p>
    </section>

    <section class="now-playing">
      <h2>Release Date</h2>
      <p id="songDate">{{RELEASE_DATE}}</p>
    </section>

    <section class="now-playing">
      <details class="lyrics-dropdown">
        <summary>Lyrics</summary>

        <div
          id="translationToggleContainer"
          class="translation-toggle-container"
        >
          <input
            type="checkbox"
            id="translationToggle"
          />

          <label for="translationToggle">
            Show English Translation
          </label>
        </div>

        <pre id="songLyrics">{{SONG_LYRICS}}</pre>
      </details>
    </section>

  </main>

  <script src="../script/songlist.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const songTitle = document.body.dataset.songTitle;
      const songId = document.body.dataset.songId;

      const lyricsElement = document.getElementById("songLyrics");
      const toggleContainer = document.getElementById(
        "translationToggleContainer"
      );
      const toggle = document.getElementById("translationToggle");

      // Keep the generated lyrics as an initial fallback.
      let originalLyrics = lyricsElement.textContent;
      let englishTranslation = null;

      
      // ==========================================
      // LOAD ORIGINAL LYRICS FROM JSON + FIRESTORE
      // ==========================================

      try {
        const { loadSong } = await import(
          "../../script/song-data.js"
        );

        const song = await loadSong(
          songId,
          songTitle,
          "../audio/song-details.json"
        );

        if (song && typeof song.lyrics === "string") {
          originalLyrics = song.lyrics;
          lyricsElement.textContent = originalLyrics;
        }

      } catch (error) {
        console.warn(
          "Using generated original lyrics:",
          error
        );
      }


      // Check whether this song has an English translation.
      try {
        const response = await fetch(
          "../../data/translation.json"
        );

        if (!response.ok) {
          return;
        }

        const translations = await response.json();

        if (
          !translations ||
          typeof translations !== "object" ||
          Array.isArray(translations)
        ) {
          return;
        }

        // Translation keys are song titles.
        const translation = translations[songTitle];

        if (
          typeof translation !== "string" ||
          !translation.trim()
        ) {
          return;
        }

        englishTranslation = translation;

        // Only display the toggle when a translation exists.
        toggleContainer.classList.add("visible");

      } catch (error) {
        console.warn(
          "Translation unavailable:",
          error
        );
      }

      // Switch between original and translated lyrics.
      toggle.addEventListener("change", () => {
        if (toggle.checked && englishTranslation !== null) {
          lyricsElement.textContent = englishTranslation;
        } else {
          lyricsElement.textContent = originalLyrics;
        }
      });
    });
  </script>

</body>
</html>
