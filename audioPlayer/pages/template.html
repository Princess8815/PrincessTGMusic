<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}" />
  <meta property="og:title" content="{{PAGE_TITLE}}" />
  <meta property="og:description" content="{{META_DESCRIPTION}}" />
  <meta property="og:image" content="{{LOGO_URL}}" />
  <meta property="og:url" content="{{PAGE_URL}}" />
  <meta property="og:type" content="music.song" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{PAGE_TITLE}}" />
  <meta name="twitter:description" content="{{META_DESCRIPTION}}" />
  <meta name="twitter:image" content="{{LOGO_URL}}" />
  <link rel="icon" type="image/png" href="../../images/logo avatar.png" />
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body data-song-id="{{PAGE_ID}}" data-song-title="{{SONG_TITLE}}">
  <main class="app">
    <button id="back" type="button"><a href="../index.html">Back to Song List</a></button>
    <header class="app__header">
      <h1 id="songTitle">{{SONG_TITLE}}</h1>
      <p class="status">Song details page</p>
    </header>

    <section class="now-playing">
      <audio id="songPlayer" controls style="width:100%; margin-top:10px;"></audio>
      <button id="playSong" type="button">Play</button>
      <button id="stopSong" type="button">Stop</button>
    </section>

    <section class="now-playing">
      <h2>Description</h2>
      <p id="songDescription">{{SONG_DESCRIPTION}}</p>
    </section>

    <section class="now-playing">
      <h2>Album</h2>
      <p id="songAlbum">{{SONG_ALBUM}}</p>
    </section>

    <section class="now-playing">
      <h2>Release Date</h2>
      <p id="songDate">{{RELEASE_DATE}}</p>
    </section>

    <section class="now-playing">
      <details class="lyrics-dropdown">
        <summary>Lyrics</summary>
        <pre id="songLyrics">{{SONG_LYRICS}}</pre>
      </details>
    </section>
  </main>

  <script src="../script/songlist.js"></script>
</body>
</html>
